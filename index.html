<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>منيو مستر سيخو - النسخة النهائية المعتمدة للطباعة A5</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--ub:#ececec;--ui:#222;--ubtn:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ub:#1b1b1b;--ui:#eee;--ubtn:#333}}
:root[data-theme="dark"]{--ub:#1b1b1b;--ui:#eee;--ubtn:#333}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ub);color:var(--ui);font-family:Cairo,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ui{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--ub);padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ui button{font:700 13px Cairo;border:1px solid #8886;background:var(--ubtn);color:var(--ui);border-radius:8px;padding:6px 12px;cursor:pointer;transition:all .15s ease}
.ui button:hover{background:#ddd}
.ui button.on{background:#c1121f;color:#fff;border-color:#c1121f;box-shadow:0 2px 6px rgba(193,18,31,.35)}
.ui button.btn-action{background:#1e7e34;color:#fff;border-color:#1e7e34;font-weight:800}
.ui button.btn-action:hover{background:#155724}
.stage{overflow-x:hidden;padding:0 8px 24px}
.lbl{text-align:center;font-weight:800;margin:12px 0 6px;font-size:13.5px;color:var(--ui);letter-spacing:.3px}
.page{width:210mm;height:148mm;position:relative;overflow:hidden;box-sizing:border-box;padding:7.5mm 8mm 6.5mm;display:flex;flex-direction:column;gap:2.2mm;background-color:var(--bg);background-image:var(--bgi);color:var(--ink);font-family:Cairo,sans-serif;margin:0 auto;transform-origin:top center;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* Header layout & Logo Badge */
.head{flex:none;display:flex;justify-content:space-between;align-items:center;gap:3mm;min-height:22mm}
.head-right{display:flex;flex-direction:column;gap:1mm;justify-content:center}
.chips{display:flex;align-items:center;flex-wrap:nowrap}
.chips i{font:normal 10.5pt/1.2 Lalezar;background:var(--tbg);color:var(--tink);padding:.6mm 3.2mm;border-radius:var(--rad);display:inline-block;margin-inline-end:1.5mm;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tag{font:10.5pt/1.25 Lalezar;color:var(--tag-color, var(--price));margin-top:.8mm;letter-spacing:.2px}

/* Logo Medallion / Badge for guaranteed high-contrast & razor-sharp print */
.logo-badge{
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--lbg,#ffffff);
  border:var(--lbd,0.5mm solid var(--price));
  border-radius:var(--lrad,3mm);
  box-shadow:var(--lcs,0 1.5mm 3.5mm rgba(0,0,0,.22));
  padding:1mm 2.2mm;
  height:20.5mm;
  box-sizing:border-box;
  flex:none;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}
.lg{
  height:18.5mm;
  max-width:38mm;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 0.5mm 1mm rgba(0,0,0,.12));
}

.contact{direction:ltr;font-weight:800;font-size:8pt;display:flex;flex-direction:column;justify-content:center}
.contact span{display:block;background:var(--tbg);color:var(--tink);border-radius:99px;padding:.3mm 3mm;margin:.5mm 0;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.12);letter-spacing:.3px}
.contact p{margin:1mm 0 0;font-size:6.6pt;direction:rtl;text-align:left;font-weight:700;line-height:1.2;color:var(--ink)}

/* Grid layout */
.cols{flex:1;display:grid;gap:2.2mm;min-height:0}
.cols.f{grid-template-columns:1.02fr 1.25fr .95fr}
.cols.b{grid-template-columns:1.05fr 1fr 1.18fr .87fr}
.col{display:flex;flex-direction:column;gap:2.2mm;min-height:0}

/* Section cards */
.sec{background:var(--card);color:var(--cink);border-radius:var(--rad);border:var(--cb);padding:1.6mm 2mm;display:flex;flex-direction:column;flex:1 1 0;min-height:0;overflow:hidden;box-shadow:var(--cs)}
.sec h3{font:11pt/1.2 Lalezar;margin:0 0 1.2mm;text-align:center;background:var(--tbg);color:var(--tink);padding:.6mm 2mm;border-radius:var(--head-rad, 1mm);flex:none}
.rows{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.r{flex:1;min-height:0;max-height:8.5mm;display:grid;grid-template-columns:1fr repeat(var(--c),10.5mm);align-items:center;gap:1mm;padding:0 1mm;font-size:7.4pt;font-weight:700;line-height:1.15;border-bottom:.2mm dotted var(--line)}
.r span{white-space:normal;overflow:visible;text-overflow:clip}
.r b{text-align:center;color:var(--price);font-size:8.8pt;font-weight:800;letter-spacing:.1mm;white-space:nowrap}
.r.h{flex:none;font-size:6.6pt}.r.h b{color:var(--cink);font-size:6.8pt;opacity:.85}
.sec small{font-size:6.2pt;font-weight:700;text-align:center;color:var(--price);margin-top:1mm;flex:none}
.col>.sec.flat{flex:none}
.col>.sec.flat .r{flex:none;height:6.2mm}

/* Boxes for combos */
.box{background:var(--card);color:var(--cink);border:var(--cb);border-radius:var(--rad);padding:1.5mm;text-align:center;flex:1;display:flex;flex-direction:column;box-shadow:var(--cs)}
.box h3{font:11pt/1.2 Lalezar;margin:0 0 1mm;background:var(--tbg);color:var(--tink);padding:.4mm;border-radius:var(--head-rad, 1mm)}
.box p{margin:0;flex:1;font-size:7pt;font-weight:700;line-height:1.5;display:flex;flex-direction:column;justify-content:center}
.bp{display:flex;justify-content:space-around;font-size:6.6pt;font-weight:700}
.bp span{display:flex;flex-direction:column}.bp b{font:14pt/1 Lalezar;color:var(--price)}

/* Photo Promos & Strips with crisp captions */
.col>.promo{flex:0 0 38mm;min-height:0;overflow:hidden;position:relative;z-index:0;background:var(--card);border:var(--cb);border-radius:var(--rad);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1.6mm;padding:1.6mm;box-shadow:var(--cs)}
.promo figure,.strip figure{margin:0;position:relative;min-height:0;min-width:0;display:block;overflow:hidden;border-radius:var(--ir);border:var(--ib)}
.promo figure img,.strip figure img{border:0;border-radius:0;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
figcaption{position:absolute;inset:auto 0 0 0;padding:3mm 1mm .8mm;text-align:center;font:800 6.6pt/1.1 Cairo;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.82));text-shadow:0 0 .8mm #000}

.strip{display:grid;grid-template-columns:1fr 1fr 1.7fr 1fr 1fr;gap:2mm;height:19mm;overflow:hidden;flex:none}
.strip .sl{font:11.5pt/1.25 Lalezar;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--tbg);color:var(--tink);border-radius:var(--rad);padding:0 2mm;box-shadow:0 1px 2px rgba(0,0,0,.15)}

.foot{flex:none;font:700 7.2pt/1.2 Cairo;text-align:center;background:var(--tbg);color:var(--tink);padding:1.1mm 2mm;border-radius:var(--rad);letter-spacing:.2px;box-shadow:0 1px 2px rgba(0,0,0,.15)}

/* =========================================================================
   THEMES PALETTES & TAILORED PRINT-OPTIMIZED LOGO BADGES
   ========================================================================= */

/* Theme 1: Charcoal Fire (نار الفحم) */
.t1{
  --bg:#17120f;--bgi:radial-gradient(120% 45% at 50% 118%,rgba(255,90,20,.65),transparent 70%);
  --ink:#f6e9d8;--cink:#f6e9d8;--card:rgba(255,255,255,.07);--tbg:linear-gradient(90deg,#c1121f,#ff6a1a);
  --tink:#fff;--price:#ffc247;--tag-color:#ff9e42;--line:#ffffff26;--rad:3mm;--cb:0;--cs:none;
  --ir:3mm;--ib:.35mm solid #ff6a1a;
  --lbg:#ffffff;--lbd:0.55mm solid #ff6a1a;--lcs:0 1.5mm 4mm rgba(255,106,26,.3);--lrad:3.5mm;
}
.t1 h3{clip-path:polygon(0 10%,4% 0,96% 8%,100% 0,98% 55%,100% 100%,3% 92%,0 100%)}

/* Theme 2: Classic Red (الكلاسيك) */
.t2{
  --bg:#fbefe0;--bgi:repeating-linear-gradient(45deg,transparent 0 3mm,#9b1b2310 3mm 3.4mm);
  --ink:#3a1410;--cink:#3a1410;--card:rgba(255,255,255,.78);--tbg:#9b1b23;
  --tink:#fff;--price:#8a1018;--tag-color:#9b1b23;--line:#c9a58a66;--rad:2mm;--cb:.25mm solid #9b1b2355;--cs:none;
  --ir:3mm;--ib:.4mm solid #9b1b23;
  --lbg:#ffffff;--lbd:0.55mm solid #9b1b23;--lcs:0 1.2mm 3.5mm rgba(155,27,35,.2);--lrad:3mm;
}
.t2 h3{border-radius:99px}
.t2::after{content:"";position:absolute;inset:4mm;border:.4mm solid #9b1b23;border-radius:2mm;pointer-events:none}

/* Theme 3: Royal Olive & Gold (الملكي الزيتي) */
.t3{
  --bg:#1f2a1c;--bgi:radial-gradient(#c9a24a26 .5mm,transparent .6mm);background-size:4mm 4mm;
  --ink:#f3ead2;--cink:#f3ead2;--card:rgba(243,234,210,.08);--tbg:#c9a24a;
  --tink:#1f2a1c;--price:#e8c872;--tag-color:#f1d68c;--line:#c9a24a66;--rad:1.5mm;--cb:.25mm solid #c9a24a88;--cs:none;
  --ir:1.5mm;--ib:.35mm solid #c9a24a;
  --lbg:#fdfbf4;--lbd:0.6mm solid #c9a24a;--lcs:0 1.5mm 4mm rgba(201,162,74,.35);--lrad:3mm;
}
.t3 h3{clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%)}
.t3::after{content:"";position:absolute;inset:4mm;border:.35mm solid #c9a24a;border-radius:2mm;pointer-events:none}

/* Theme 4: Street Food Yellow (ستريت فود) */
.t4{
  --bg:#ffd23f;--bgi:radial-gradient(#0002 .35mm,transparent .4mm);background-size:2.5mm 2.5mm;
  --ink:#161616;--cink:#161616;--card:#fff;--tbg:#161616;
  --tink:#ffd23f;--price:#c1121f;--tag-color:#161616;--line:#16161666;--rad:3.5mm;--cb:.45mm solid #161616;--cs:.9mm .9mm 0 #161616;
  --ir:3.5mm;--ib:.45mm solid #161616;
  --lbg:#ffffff;--lbd:0.65mm solid #161616;--lcs:.9mm .9mm 0 #161616;--lrad:3.5mm;
}
.t4 h3{transform:rotate(-1.5deg);box-shadow:.7mm .7mm 0 #d62828;margin-top:.5mm}

/* Theme 5: Navy Modern (عصري كحلي) */
.t5{
  --bg:#0f2540;--bgi:linear-gradient(115deg,transparent 62%,#ef6c0033 62% 64%,transparent 64%);
  --ink:#eaf1fb;--cink:#10243d;--card:#fff;--tbg:#c24a00;
  --tink:#fff;--price:#c24a00;--tag-color:#ffb066;--line:#10243d33;--rad:3mm;--cb:0;--cs:none;
  --ir:3mm;--ib:.4mm solid #c24a00;
  --lbg:#ffffff;--lbd:0.6mm solid #ef6c00;--lcs:0 1.5mm 4mm rgba(239,108,0,.3);--lrad:3.5mm;
}
.t5 .sec{overflow:hidden}
.t5 .sec h3{margin:-1.6mm -2mm 1.2mm;padding:1mm;background:#c24a00}

/* Theme 6: Luxury Black & Gold (أسود وذهبي) */
.t6{
  --bg:#0b0b0b;--bgi:linear-gradient(135deg,#1c1c1c,#000);
  --ink:#f4e7c3;--cink:#f4e7c3;--card:transparent;--tbg:transparent;
  --tink:#d4af37;--price:#d4af37;--tag-color:#ecd27e;--line:#d4af3755;--rad:0;--cb:.25mm solid #d4af37;--cs:none;
  --ir:0;--ib:.3mm solid #d4af37;
  --lbg:#181818;--lbd:0.6mm solid #d4af37;--lcs:0 1.5mm 4mm rgba(212,175,55,.3);--lrad:2mm;
}
.t6 h3{border-bottom:.3mm solid #d4af37;letter-spacing:.3mm}
.t6::after{content:"";position:absolute;inset:4mm;border:.3mm solid #d4af37;pointer-events:none}
.t6 .chips i,.t6 .contact span,.t6 .sl{border:.3mm solid #d4af37}

/* Theme 7: Fiery Red & Amber (أحمر ناري) */
.t7{
  --bg:#b3121a;--bgi:radial-gradient(130% 40% at 50% 120%,#ffb020aa,transparent 70%);
  --ink:#fff4e6;--cink:#3a0f0c;--card:#fff6ea;--tbg:#1a1a1a;
  --tink:#ffc247;--price:#b3121a;--tag-color:#ffd77a;--line:#b3121a40;--rad:4mm;--cb:0;--cs:none;
  --ir:50%;--ib:.8mm solid #fff6ea;
  --lbg:#ffffff;--lbd:0.6mm solid #ffb020;--lcs:0 1.5mm 4mm rgba(0,0,0,.35);--lrad:3.5mm;
}
.t7 h3{border-radius:99px}

/* Theme 8: Kraft Paper & Rust (ورق كرافت) */
.t8{
  --bg:#c9a57a;--bgi:repeating-linear-gradient(0deg,#0000 0 1mm,#00000010 1mm 1.2mm);
  --ink:#2b1a0e;--cink:#2b1a0e;--card:#f3e3c7;--tbg:#7a2e1b;
  --tink:#f3e3c7;--price:#6a2010;--tag-color:#7a2e1b;--line:#7a2e1b66;--rad:1mm;--cb:.35mm dashed #7a2e1b;--cs:none;
  --ir:1mm;--ib:1mm solid #f8f1e3;
  --lbg:#fff8ee;--lbd:0.6mm solid #7a2e1b;--lcs:0 1.2mm 3.5mm rgba(122,46,27,.25);--lrad:2mm;
}
.t8 h3{transform:rotate(1deg);outline:.3mm dashed #f3e3c7;outline-offset:-1mm}

/* Theme 9: Fresh Turquoise (فيروزي فريش) */
.t9{
  --bg:#0e6e6a;--bgi:radial-gradient(circle at 15% 20%,#ffffff18 0 12mm,transparent 12.2mm),radial-gradient(circle at 90% 85%,#ffffff14 0 18mm,transparent 18.2mm);
  --ink:#fff8ea;--cink:#12403e;--card:#fff8ea;--tbg:#ffb703;
  --tink:#12403e;--price:#b3263d;--tag-color:#ffd166;--line:#12403e33;--rad:5mm;--cb:0;--cs:none;
  --ir:5mm;--ib:.6mm solid #ffb703;
  --lbg:#ffffff;--lbd:0.6mm solid #ffb703;--lcs:0 1.5mm 4mm rgba(0,0,0,.3);--lrad:4mm;
}
.t9 h3{border-radius:99px}

/* Theme 10: Cyber Neon Night (نيون ليلي) */
.t10{
  --bg:#150b2e;--bgi:radial-gradient(60% 50% at 20% 0,#7b2cff55,transparent),radial-gradient(60% 50% at 90% 100%,#ff2e9355,transparent);
  --ink:#f3e9ff;--cink:#f3e9ff;--card:#ffffff0d;--tbg:transparent;
  --tink:#27e6ff;--price:#ff4fb0;--tag-color:#27e6ff;--line:#ffffff2a;--rad:3mm;--cb:.3mm solid #27e6ff88;--cs:0 0 2mm #27e6ff44;
  --ir:3mm;--ib:.3mm solid #ff4fb0;
  --lbg:#13082a;--lbd:0.6mm solid #27e6ff;--lcs:0 0 3mm #27e6ff88;--lrad:3.5mm;
}
.t10 h3{border:.3mm solid #27e6ff;border-radius:99px;text-shadow:0 0 2mm #27e6ff}
.t10 .chips i,.t10 .contact span,.t10 .sl{border:.3mm solid #27e6ff}

/* =========================================================================
   PRINT / PDF SETTINGS
   ========================================================================= */
@page{size:210mm 148mm;margin:0}
@media print{
  .ui,.lbl{display:none !important}
  body{background:none !important}
  .stage{padding:0 !important;overflow:visible !important}
  .page{zoom:1 !important;margin:0 !important;page-break-after:always !important}
}
body.bleed .page{width:216mm;height:154mm;padding:10.5mm 11mm 9.5mm}
body.bleed .t2::after,body.bleed .t3::after,body.bleed .t6::after{inset:7mm}
</style></head><body>

const ui = document.getElementById('ui'), st = document.getElementById('s');
function show(i) {
  st.innerHTML = build(T[i][1]);
  [...ui.querySelectorAll('button:not(.btn-action)')].forEach((b, j) => b.classList.toggle('on', j === i));
  fit();
}

function fit() {
  const z = Math.min(1, (innerWidth - 20) / 794);
  document.querySelectorAll('.page').forEach(p => p.style.zoom = z);
}

T.forEach((t, i) => {
  const b = document.createElement('button');
  b.textContent = (i + 1) + " - " + t[0];
  b.onclick = () => show(i);
  ui.appendChild(b);
});

async function go(bleed) {
  try {
    await Promise.all([document.fonts.load('700 12px Cairo'), document.fonts.load('12px Lalezar')]);
  } catch(e) {}
  if (!(document.fonts.check('700 12px Cairo') && document.fonts.check('12px Lalezar')) && !confirm('خطوط Cairo و Lalezar لم تُحمَّل بالكامل. الطباعة الآن قد تظهر بخط بديل. هل ترغب بالمتابعة؟')) return;
  let styleEl;
  if (bleed) {
    document.body.classList.add('bleed');
    styleEl = document.createElement('style');
    styleEl.textContent = '@page{size:216mm 154mm;margin:0}';
    document.head.appendChild(styleEl);
  }
  const done = () => {
    document.body.classList.remove('bleed');
    if (styleEl) styleEl.remove();
    removeEventListener('afterprint', done);
  };
  addEventListener('afterprint', done);
  print();
}

/* نظام طلبات مستر سيخو - إضافة مستقلة */
(() => {
  const groups = [
    ["وجبات الفراخ", chicken, ["وجبة"]],
    ["وجبات اللحوم", meals, ["وجبة"]],
    ["المشويات", grill, ["كيلو", "نصف كيلو", "ربع كيلو"]],
    ["السندوتشات", sand, ["بلدي", "فرنساوي"]],
    ["البرجر", burger, ["بلدي", "فرنساوي"]],
    ["الحواوشي", haw, ["بلدي", "فرنساوي"]],
    ["البطاطس", pot, ["بلدي", "فرنساوي"]],
    ["الأطباق الجانبية", kit, ["طبق"]]
  ];

  const cart = [];
  const style = document.createElement("style");
  style.textContent = `
    #orderBox{direction:rtl;max-width:600px;margin:18px auto 90px;
      padding:16px;border-radius:16px;background:#fff;color:#222;
      font-family:Cairo,sans-serif;box-shadow:0 3px 15px #0002}
    #orderBox h2{text-align:center;color:#b3121a}
    #orderBox select,#orderBox input,#orderBox textarea{
      width:100%;box-sizing:border-box;padding:11px;margin:5px 0 10px;
      border:1px solid #ccc;border-radius:8px;font:inherit}
    #orderBox button{border:0;border-radius:9px;padding:11px;
      font:700 15px Cairo,sans-serif;cursor:pointer}
    #addItem{background:#b3121a;color:#fff;width:100%}
    #sendOrder{background:#16803c;color:#fff;width:100%;margin-top:12px}
    #cartItems{padding:0;list-style:none}
    #cartItems li{padding:9px 0;border-bottom:1px solid #ddd}
    #cartItems button{padding:3px 9px;margin-inline-start:5px}
  `;
  document.head.appendChild(style);

  const box = document.createElement("section");
  box.id = "orderBox";
  box.innerHTML = `
    <h2>🛒 اطلب أونلاين من مستر سيخو</h2>
    <label>القسم</label><select id="orderGroup"></select>
    <label>الصنف</label><select id="orderProduct"></select>
    <label>الحجم أو النوع</label><select id="orderSize"></select>
    <button id="addItem">إضافة للسلة</button>
    <h3>سلة الطلبات</h3><ul id="cartItems"></ul>
    <h3 id="cartTotal">الإجمالي: ٠ جنيه</h3>
    <label>الاسم</label><input id="customerName" placeholder="اسمك" />
    <label>رقم الموبايل</label><input id="customerPhone" inputmode="tel" placeholder="01xxxxxxxxx" />
    <label>طريقة الاستلام</label>
    <select id="receive"><option value="توصيل">توصيل</option><option value="استلام من المطعم">استلام من المطعم</option></select>
    <label>العنوان (للتوصيل)</label><textarea id="customerAddress" placeholder="العنوان بالتفصيل"></textarea>
    <label>طريقة الدفع</label>
    <select id="payment">
      <option>كاش عند الاستلام</option>
      <option>محفظة إلكترونية</option>
      <option>InstaPay</option>
    </select>
    <p>رقم التحويل للمحفظة أو إنستا باي: <b dir="ltr">01226405610</b></p>
    <p>تنبيه: التحويل يحتاج إلى مراجعة وتأكيد من المطعم.</p>
    <button id="sendOrder">إرسال الطلب إلى واتساب</button>
  `;
  document.body.appendChild(box);

  const $ = id => document.getElementById(id);
  const group = $("orderGroup");
  const product = $("orderProduct");
  const size = $("orderSize");

  groups.forEach((g, i) => group.add(new Option(g[0], i)));

  function loadProducts() {
    product.replaceChildren();
    groups[+group.value][1].forEach((item, i) =>
      product.add(new Option(item[0], i))
    );
    loadSizes();
  }

  function loadSizes() {
    size.replaceChildren();
    const [name, ...prices] = groups[+group.value][1][+product.value];
    const labels = groups[+group.value][2];
    prices.forEach((price, i) => {
      if (price > 0) {
        const label = labels.length === 1 ? labels[0] : (labels[i] || "اختيار " + (i + 1));
        size.add(new Option(`${label} - ${price} جنيه`, `${i}:${price}`));
      }
    });
  }

  function renderCart() {
    const list = $("cartItems");
    list.replaceChildren();
    let total = 0;
    cart.forEach((item, i) => {
      total += item.price * item.qty;
      const li = document.createElement("li");
      li.append(document.createTextNode(
        `${item.name} (${item.size}) × ${item.qty} = ${item.price * item.qty} جنيه `
      ));
      [-1, 1].forEach(delta => {
        const btn = document.createElement("button");
        btn.textContent = delta === 1 ? "+" : "−";
        btn.onclick = () => {
          item.qty += delta;
          if (item.qty <= 0) cart.splice(i, 1);
          renderCart();
        };
        li.appendChild(btn);
      });
      list.appendChild(li);
    });
    $("cartTotal").textContent = `الإجمالي: ${total} جنيه`;
  }

  group.onchange = loadProducts;
  product.onchange = loadSizes;

  $("addItem").onclick = () => {
    const [name] = groups[+group.value][1][+product.value];
    if (!size.value) return alert("اختار الحجم أو النوع أولًا");
    const [index, price] = size.value.split(":").map(Number);
    const labels = groups[+group.value][2];
    const sizeLabel = labels.length === 1 ? labels[0] : labels[index];
    const existing = cart.find(x =>
      x.name === name && x.size === sizeLabel && x.price === price
    );
    if (existing) existing.qty++;
    else cart.push({name, size: sizeLabel, price, qty: 1});
    renderCart();
  };

  $("receive").onchange = () => {
    $("customerAddress").required = $("receive").value === "توصيل";
  };

  $("sendOrder").onclick = () => {
    if (!cart.length) return alert("أضف صنفًا للسلة أولًا");
    const name = $("customerName").value.trim();
    const phone = $("customerPhone").value.trim();
    const receive = $("receive").value;
    const address = $("customerAddress").value.trim();
    if (!name || !phone) return alert("اكتب الاسم ورقم الموبايل");
    if (receive === "توصيل" && !address) return alert("اكتب عنوان التوصيل");

    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    const details = cart.map(item =>
      `• ${item.name} - ${item.size} × ${item.qty} = ${item.price * item.qty} جنيه`
    ).join("\n");
    const message = [
      "طلب جديد من منيو مستر سيخو",
      `الاسم: ${name}`,
      `الموبايل: ${phone}`,
      `الاستلام: ${receive}`,
      ...(receive === "توصيل" ? [`العنوان: ${address}`] : []),
      `الدفع: ${$("payment").value}`,
      "",
      details,
      "",
      `الإجمالي قبل رسوم التوصيل: ${total} جنيه`,
      "يرجى تأكيد توافر الأصناف وأي رسوم توصيل مع المطعم."
    ].join("\n");

    window.open(
      "https://wa.me/201033332315?text=" + encodeURIComponent(message),
      "_blank"
    );
  };

  loadProducts();
})();
